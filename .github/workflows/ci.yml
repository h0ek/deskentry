name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libglib2.0-dev libgdk-pixbuf-2.0-dev librsvg2-common desktop-file-utils hicolor-icon-theme
      - name: Install Rust
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.94.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets
      - run: timeout 10m cargo test --locked
      - run: cargo build --locked --release
      - name: Package tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          install -Dm755 target/release/deskentry "dist/deskentry-$version-x86_64"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: deskentry-release
          path: dist/deskentry-*-x86_64
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: deskentry-release
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          test "$(git cat-file -t "$tag")" = tag
          gh release create "$tag" "dist/deskentry-$version-x86_64" --verify-tag --title "$tag" --notes-from-tag
